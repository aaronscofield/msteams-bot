[project]
name = "teams-bot"
version = "1.5.0"
description = "Company Teams approval bot on the Microsoft 365 Agents SDK"
requires-python = ">=3.14"
dependencies = [
  "microsoft-agents-authentication-msal==1.5.0",
  "pyjwt>=2.13.0",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28.1",
  "microsoft-agents-hosting-fastapi==1.5.0",
  "uvicorn[standard]>=0.52.4",
  "asgi-correlation-id>=5.0.1",
]

[project.scripts]
approval-bot = "approval_bot.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/approval_bot"]

[dependency-groups]
dev = ["ruff>=0.14"]
